<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Platzhalter Hero-Bild 1920x1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#332a1d"/>
      <stop offset="50%" stop-color="#2c2418"/>
      <stop offset="100%" stop-color="#17130e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#b8860b" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#b8860b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- dezente Linienmotive: Violine & Gitarre -->
  <g fill="none" stroke="#b8860b" stroke-opacity="0.16" stroke-width="2">
    <path d="M330 1080 C 620 760, 760 600, 880 300"/>
    <path d="M1590 1080 C 1300 760, 1160 600, 1040 300"/>
    <circle cx="960" cy="470" r="200"/>
    <circle cx="960" cy="470" r="270"/>
  </g>

  <!-- Platzhalter-Kennzeichnung: bewusst klein, damit nichts mit dem Text kollidiert -->
  <g font-family="system-ui, sans-serif" font-size="20" fill="#f5f0e8" fill-opacity="0.38">
    <text x="48" y="1032">PLATZHALTER · HERO-FOTO 1920 × 1080</text>
    <text x="1872" y="1032" text-anchor="end">BITTE DURCH ECHTES FOTO ERSETZEN</text>
  </g>
  <rect x="24" y="24" width="1872" height="1032" fill="none" stroke="#b8860b" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="16 14"/>
</svg>
